services:

  api:
    build: .
    container_name: industrial-rag-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./qdrant_storage:/app/qdrant_storage
    restart: unless-stopped

  streamlit:
    build: .
    container_name: industrial-rag-streamlit
    command: streamlit run app/app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    depends_on:
      - api
    environment:
      - API_URL=http://api:8000
    restart: unless-stopped